databases:
  - name: noise-monitor-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: office-noise-monitor
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noise-monitor-db
          property: connectionString
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
