<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login — Noise Monitor</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="card" style="max-width:360px;margin:80px auto;">
  <h2>Dashboard Login</h2>
  <label for="pw">Password</label>
  <input type="password" id="pw" autofocus>
  <div class="error" id="err" style="display:none;">Wrong password.</div>
  <button id="go">Log in</button>
</div>
<script>
async function tryLogin() {
  const password = document.getElementById('pw').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password })
  });
  if (res.ok) {
    window.location.href = '/dashboard.html';
  } else {
    document.getElementById('err').style.display = 'block';
  }
}
document.getElementById('go').addEventListener('click', tryLogin);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
</script>
</body>
</html>
